name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nicheradar_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nicheradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nicheradar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NR_TEST_DATABASE_URL: postgresql+psycopg://nicheradar_test:synthetic-ci-only@127.0.0.1:5432/nicheradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
